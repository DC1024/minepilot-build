name: Build MinePilot Jar

on:
  push:
    branches: [main, feature/autonomy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew build --no-daemon -x test --stacktrace

      - name: List build output
        run: ls -la build/libs/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcai_companion-jar
          path: build/libs/mcai_companion-*.jar
          if-no-files-found: error
          retention-days: 30

      # 之前 build 用了 -x test，导致单测从未执行：提示词长度越界这类回归
      # 只能等服务器启动崩溃才发现。这里单独跑一次并上传 JUnit 报告。
      # 注意：套件当前有 8 个历史失败（JdkProviderCapabilityProbeContractTest
      # / ProviderErrorClassifierTest / HiddenSeedEvaluationHarnessTest），
      # 直接要求「全绿」会把每次发布都堵死（见提交 9836f2f），所以下面改为
      # 基于 JUnit XML 的已知失败清单闸门：清单内的失败放行，清单外的一律阻断。
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          ./gradlew test --no-daemon --continue
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: build/reports/tests/test
          if-no-files-found: warn
          retention-days: 30

      # ---- 已知失败清单闸门 ----
      # 解析 Gradle 的 JUnit XML，把失败按类名分成「清单内 / 清单外」两类：
      #   清单外出现任何失败 -> gate=fail，阻断发布（::error:: 列出类名）
      #   失败全在清单内     -> gate=pass，照常发布（::warning:: 说明还剩几个）
      #   清单某项已不再失败 -> ::warning:: 提示删掉该条目，清单逐步收敛到空
      #   一个 XML 都没找到 -> gate=fail（防止 gradle 静默没跑测试）
      - name: Gate release on known test failures
        id: gate
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          # 已知失败清单（全限定类名；JUnit 里内部类写作 Foo$Bar，一并算同一条）
          # 清单是欠账，不是豁免：修好一个就删一条，直到清空。
          #   JdkProviderCapabilityProbeContractTest  19 个用例，回环服务器，超时类易 flaky
          #   ProviderErrorClassifierTest             6 个用例，纯逻辑
          # HiddenSeedEvaluationHarnessTest 原本缺 scripts/run-hidden-seed-evaluations.py，
          # 该脚本已补上，故不再列入清单；若它再失败，应当真的把发布拦下来。
          ALLOWLIST = (
              'dev.mcai.companion.model.JdkProviderCapabilityProbeContractTest',
              'dev.mcai.companion.model.ProviderErrorClassifierTest',
          )

          def in_allowlist(cls):
              for a in ALLOWLIST:
                  if cls == a or cls.startswith(a + '$'):
                      return True
              return False

          # Gradle 默认把 JUnit XML 写到 build/test-results/test/，这里再递归兜底一次
          files = sorted(glob.glob('build/test-results/test/*.xml'))
          if not files:
              files = sorted(glob.glob('build/test-results/**/*.xml', recursive=True))
          files = [p for p in files if os.path.basename(p).startswith('TEST-')]

          out_path = os.environ.get('GITHUB_OUTPUT')

          def emit(**kv):
              if out_path:
                  with open(out_path, 'a') as f:
                      for k, v in kv.items():
                          f.write(f'{k}={v}\n')

          if not files:
              print('::error::build/test-results/ 下没有找到任何 TEST-*.xml —— 测试很可能根本没跑。按闸门失败处理，不发布。')
              emit(ok='false', known='0', unknown='0')
              sys.exit(1)

          counts = {}
          bad_xml = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as e:
                  bad_xml.append(f'{path}: {e}')
                  continue
              for tc in root.iter('testcase'):
                  if tc.find('failure') is None and tc.find('error') is None:
                      continue
                  counts[tc.get('classname') or ''] = counts.get(tc.get('classname') or '', 0) + 1

          if bad_xml:
              print('::error::无法解析 JUnit XML: ' + '; '.join(bad_xml) + '。按闸门失败处理，不发布。')
              emit(ok='false', known='0', unknown='0')
              sys.exit(1)

          known = {c: n for c, n in counts.items() if in_allowlist(c)}
          unknown = {c: n for c, n in counts.items() if not in_allowlist(c)}

          def fmt(d):
              return ', '.join(f'{c} ({n})' for c, n in sorted(d.items()))

          if unknown:
              print(f'::error::{sum(unknown.values())} 个测试失败落在已知失败清单之外，阻断发布: {fmt(unknown)}')
              emit(ok='false', known=str(sum(known.values())), unknown=str(sum(unknown.values())))
              sys.exit(1)

          print(f'发布闸门通过：无清单外失败，剩余已知失败 {sum(known.values())} 个。')
          if known:
              print(f'::warning::{sum(known.values())} 个已知失败仍在清单内，本次照常发布: {fmt(known)}')
          for a in ALLOWLIST:
              if a not in known:
                  print(f'::warning::已知失败清单里的 {a} 本次没有失败，可以把它从清单中移除（清单应逐步收敛到空）。')
          emit(ok='true', known=str(sum(known.values())), unknown='0')
          PY

      - name: Warn on failing tests
        if: steps.gate.outputs.ok != 'true'
        run: |
          echo "::warning::Unit tests did not pass. The jar was built but is NOT published to mcai-companion-latest."

      # 读取部署固定版本（deploy-target.txt），缺省 26.2 / 65.0.0
      - name: Read deploy-target.txt
        id: read_target
        run: |
          if [ -f deploy-target.txt ]; then
            echo "mc=$(grep '^MC_VERSION=' deploy-target.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "forge=$(grep '^FORGE_VERSION=' deploy-target.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      # ---- 版本兼容闸门 ----
      # 部署把 MC/Forge 版本写死在 docker-compose 里。若上游把模组支持版本从部署固定版本升走，
      # 新 jar 与运行服不兼容 -> 【不发布】到 mcai-companion-latest（部署继续拉上一个兼容 jar）并仅告警。
      - name: Check deploy-target compatibility
        id: compat
        env:
          MC_EXP: ${{ steps.read_target.outputs.mc || '26.2' }}
          FORGE_EXP: ${{ steps.read_target.outputs.forge || '65.0.0' }}
        run: |
          python3 - <<'PY'
          import re, os

          def vt(v):
              # "26.2" -> (26, 2); tolerate non-numeric gracefully
              out = []
              for x in v.strip().split('.'):
                  out.append(int(x) if x.isdigit() else 0)
              return tuple(out)

          def in_range(exp, rng):
              # Forge-style versionRange: [26.2], [26.2,27), [26.2,), (26.1,26.3] or A||B
              rng = rng.strip()
              for part in rng.split('||'):
                  part = part.strip()
                  m = re.match(r'^([\[\(])(.*)([\]\)])$', part)
                  if not m:
                      if part == exp:
                          return True
                      continue
                  lo_inc, body, hi_inc = (m.group(1) == '[', m.group(2), m.group(3) == ']')
                  lo_s, _, hi_s = body.partition(',')
                  lo_s, hi_s = lo_s.strip(), hi_s.strip()
                  e = vt(exp)
                  if lo_s:
                      lo = vt(lo_s)
                      if e < lo or (e == lo and not lo_inc):
                          continue
                  if hi_s:
                      hi = vt(hi_s)
                      if e > hi or (e == hi and not hi_inc):
                          continue
                  return True
              return False

          txt = open('src/main/resources/META-INF/mods.toml').read()
          # split into mod header (parts[0]) + each [[dependencies.mcai_companion]] block
          parts = re.split(r'\[\[dependencies\.mcai_companion\]\]', txt)
          mc_rng = forge_rng = None
          for b in parts[1:]:
              if 'modId="minecraft"' in b:
                  mm = re.search(r'versionRange="([^"]+)"', b)
                  if mm:
                      mc_rng = mm.group(1)
              if 'modId="forge"' in b:
                  fm = re.search(r'versionRange="([^"]+)"', b)
                  if fm:
                      forge_rng = fm.group(1)

          mc_exp = os.environ.get('MC_EXP', '26.2')
          forge_exp = os.environ.get('FORGE_EXP', '65.0.0')
          print(f'mod minecraft range = {mc_rng}; deploy target MC = {mc_exp}')
          print(f'mod forge range     = {forge_rng}; deploy target Forge = {forge_exp}')
          ok_mc = bool(mc_rng) and in_range(mc_exp, mc_rng)
          ok_forge = bool(forge_rng) and in_range(forge_exp, forge_rng)
          ok = ok_mc and ok_forge
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'compatible={"true" if ok else "false"}\n')
          if not ok:
              print(f'::warning::Built mod targets MC range {mc_rng} / Forge range {forge_rng}, '
                    f'but deployment is pinned to MC {mc_exp} / Forge {forge_exp}. '
                    f'Skipping release publish. Update minepilot-panel compose VERSION/FORGE_VERSION '
                    f'and minepilot-build/deploy-target.txt to match, then re-sync.')
          PY

      - name: Prepare release asset (fixed name)
        if: steps.compat.outputs.compatible == 'true' && steps.gate.outputs.ok == 'true'
        run: cp build/libs/mcai_companion-*.jar mcai_companion.jar

      - name: Publish latest jar to Release
        if: steps.compat.outputs.compatible == 'true' && steps.gate.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcai-companion-latest
          name: mcai_companion (latest)
          make_latest: false
          files: mcai_companion.jar
