// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    // 7.0.34 is pinned: ForgeGradle 7.0.35 queries the mapped
    // slimeLauncherMetadata output before its producer completes under the
    // locked Gradle 9.5 wrapper, preventing real GameTests from starting.
    id 'net.minecraftforge.gradle' version '7.0.34'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

version = '0.1.16-dev-mc26.2'
group = 'dev.mcai.companion'
base.archivesName = 'mcai_companion'

// The release is built against the oldest supported Forge 65 patch. CI and
// local compatibility checks can select another 65.x patch with
// -Pforge_compile_version=65.0.8 without changing release metadata.
def forgeCompileVersion = providers.gradleProperty(
    'forge_compile_version'
).getOrElse('65.0.0')

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

/*
 * ForgeGradle's merged source-set mode writes main classes under
 * build/sourceSets/main. Gradle's remote/local JavaCompile cache entry does
 * not restore that transformed directory on a clean checkout: compileJava
 * can report FROM-CACHE while compileTestJava then sees an empty production
 * classpath. Compile the main source set locally until ForgeGradle exposes
 * that transformed output as a complete cache artifact. This preserves
 * deterministic clean builds; the E2E source sets remain cacheable.
 */
tasks.named('compileJava') {
    outputs.doNotCacheIf(
        'ForgeGradle merged main output is not fully cache-restorable'
    ) { true }
}

/*
 * Real-client E2E support is compiled into two separate, test-only Mods.
 * Neither source set is on the production JAR input.  Development runs use
 * these source sets directly; the formal orchestrator installs the dedicated
 * test JARs beside the exact frozen production JAR.
 */
sourceSets {
    e2eClient
    e2eOracle
}

configurations {
    mcaiForgeApi
    implementation.extendsFrom mcaiForgeApi
    e2eClientImplementation.extendsFrom mcaiForgeApi
    e2eClientAnnotationProcessor.extendsFrom annotationProcessor
    e2eOracleImplementation.extendsFrom mcaiForgeApi
    e2eOracleAnnotationProcessor.extendsFrom annotationProcessor
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

def e2eInstanceRoot = providers.gradleProperty(
    'e2e_instance_root'
).getOrElse(
    layout.projectDirectory.dir('run-e2e').asFile.absolutePath
)

// GameTest worlds persist SavedData between invocations.  The default keeps
// the normal ForgeGradle `run` layout, while patch-matrix jobs can provide a
// separate directory so one patch's companion lifecycle cannot contaminate
// another patch's inner-loop result.
def gameTestWorkingDir = providers.gradleProperty(
    'gametest_working_dir'
).map { file(it) }.getOrElse(file('run'))

/*
 * A Forge patch-matrix GameTest is a real server process, and its compiled
 * classes are consumed while that process is running.  Two Gradle invocations
 * for different Forge patches must not share `build/classes` or generated
 * run metadata: the later compile can otherwise replace a Mixin class while
 * the earlier server is still starting.  Isolate opted-in GameTest builds by
 * Forge patch and temporary working-directory name.  Ordinary `check`,
 * `build`, and release paths continue to use the stable root `build/` layout.
 */
if (providers.gradleProperty('gametest_working_dir').isPresent()) {
    def safeForgeVersion = forgeCompileVersion.replaceAll('[^A-Za-z0-9_.-]', '_')
    def safeGameTestRun = gameTestWorkingDir.name
            .replaceAll('[^A-Za-z0-9_.-]', '_')
    layout.buildDirectory.set(layout.projectDirectory.dir(
        "build/gametest-${safeForgeVersion}-${safeGameTestRun}"
    ))
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'mcai_companion'
            args '--mixin.config', 'mcai_companion.mixins.json'
            args '--mixin.config', 'mcai_companion.client.mixins.json'
            if (providers.gradleProperty('live_model_test')
                    .getOrElse('false')
                    .toBoolean()) {
                systemProperty 'mcai.liveModelTest', 'true'
            }
        }

        register('client') {
            if (System.getProperty('os.name')
                    .toLowerCase(java.util.Locale.ROOT)
                    .contains('mac')) {
                // LWJGL 3.4 enforces Cocoa/GLFW initialization on the first
                // process thread. Production launchers already provide this;
                // ForgeGradle's local run configuration needs it explicitly.
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            workingDir = gameTestWorkingDir
            /*
             * Mojang's bare GameTest server leaves player view/simulation
             * distances at zero. The test-only mixin restores production-like
             * player chunk tickets for every GameTest run and is audited out
             * of the release JAR. Its 20 TPS wall-clock throttle remains
             * separately opt-in below.
             */
            args '--mixin.config',
                'mcai_companion.gametest.mixins.json'
            if (providers.gradleProperty('zero_human_autospawn_test')
                    .getOrElse('false')
                    .toBoolean()) {
                /*
                 * Opt-in production-startup gate. Keep this disabled for the
                 * ordinary parallel GameTest suite because those fixtures
                 * deliberately own their companion lifecycle.
                 */
                systemProperty 'mcai.zeroHumanAutoSpawnTest', 'true'
            }
            def liveModelEnabled = providers
                    .gradleProperty('live_model_test')
                    .getOrElse('false')
                    .toBoolean()
            def genericSelector = providers
                    .gradleProperty('test_selector')
            def legacyLiveSelector = providers
                    .gradleProperty('live_model_selector')
            if (genericSelector.isPresent()
                    && legacyLiveSelector.isPresent()
                    && genericSelector.get()
                        != legacyLiveSelector.get()) {
                throw new GradleException(
                    'test_selector and live_model_selector disagree; '
                        + 'provide only one selector or make them identical.'
                )
            }
            /* test_selector is the generic public option. Keep the older
             * live_model_selector as a compatible alias for existing CI and
             * live-evidence commands. */
            def requestedSelector = genericSelector
                    .orElse(legacyLiveSelector)
            if (requestedSelector.isPresent()) {
                def selector = requestedSelector.get()
                def selectsLiveModelScenario = selector.contains('live_model')
                        || selector.contains('surprise_zombie_defense')
                        || (selector.contains('critical_golden_apple')
                            && !selector.contains('offline_critical_golden_apple'))
                        || selector.contains('zero_human_dedicated_server_foundation')
                if (selectsLiveModelScenario && !liveModelEnabled) {
                    throw new GradleException(
                        "${selector} is a live-model GameTest; "
                            + "rerun with -Plive_model_test=true and a "
                            + "configured credential. A selected live-model "
                            + "test must never pass by taking its no-model "
                            + "skip path."
                    )
                }
                /*
                 * A selector is useful for physical/non-model GameTests too.
                 * Previously it was silently ignored unless
                 * live_model_test=true, unexpectedly launching the complete
                 * suite and polluting focused evidence.
                 */
                args '--tests', selector
            } else if (liveModelEnabled) {
                args '--tests',
                    'mcai_companion:*live_model*'
            }
            if (providers.gradleProperty('realtime_gametest')
                    .getOrElse('false')
                    .toBoolean()) {
                systemProperty 'mcai.realtimeGameTest', 'true'
            }
            if (providers.gradleProperty('test_iteration').isPresent()) {
                systemProperty 'mcai.testIteration', providers
                    .gradleProperty('test_iteration').get()
            }
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'mcai_companion', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }

        register('e2eServer') {
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            client = false
            args '--launchTarget', 'forge_userdev_server'
            args '--gameDir', '.'
            jvmArgs '-Djava.net.preferIPv6Addresses=system'
            jvmArgs '-XX:+UseCompactObjectHeaders'
            environment 'MCP_MAPPINGS', '{mcp_mappings}'
            workingDir = file("${e2eInstanceRoot}/server")
            args '--nogui'
