                            .getOrElse('MCAI')
            systemProperty 'mcai.e2e.scenario',
                    providers.gradleProperty('e2e_scenario')
                            .getOrElse('chat_follow_inventory')
            mods {
                mcai_companion {
                    source sourceSets.main
                }
                mcai_e2e_oracle {
                    source sourceSets.e2eOracle
                }
            }
        }

