repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = "Xaero's Maven"
        url = uri('https://chocolateminecraft.com/maven')
        content {
            includeGroup 'xaero.minimap'
            includeGroup 'xaero.lib'
        }
    }
}

jarJar.register {
    archiveClassifier = null
    // The development slim jar intentionally omits mod metadata so it cannot
    // be copied into a mods directory as a duplicate.  jarJar consumes that
    // archive, so put the single installable descriptor back into the
    // bundled product explicitly.
    from(sourceSets.main.resources) {
        include 'META-INF/mods.toml'
    }
}

tasks.named('jar') {
    archiveClassifier = 'slim'
    // Keep the non-installable audit input out of build/libs. A user should
    // be able to copy the contents of build/libs into a mods directory and
    // receive exactly one Forge mod instead of accidentally loading a prior
    // slim/fat development pair.
    destinationDirectory = layout.buildDirectory.dir('audit-libs')
    // The slim archive is a development/audit input, not a second installable
    // mod.  Keeping mods.toml here makes a user who copies build/libs/* into
    // mods load the same mod twice.  The jarJar archive below is the only
    // installable artifact and retains the mod metadata plus SQLite payload.
    exclude 'META-INF/mods.toml'
    // GameTest fixtures intentionally use direct world setup and must never
    // ship in the installable mod. They remain on the development run
    // classpath so runGameTestServer can exercise production skills.
    exclude 'dev/mcai/companion/embodiment/EmbodimentGameTests*.class'
    exclude 'dev/mcai/companion/embodiment/GameTestCompanionSpawn*.class'
    exclude 'dev/mcai/companion/skills/inventory/InventoryGameTests*.class'
    exclude 'dev/mcai/companion/skills/menu/MenuGameTests*.class'
    exclude 'dev/mcai/companion/skills/loot/LootGameTests*.class'
    exclude 'dev/mcai/companion/skills/farming/FarmingGameTests*.class'
    exclude 'dev/mcai/companion/communication/LiveModelChatGameTests*.class'
    exclude 'dev/mcai/companion/skills/portal/PortalCastGameTests*.class'
    exclude 'dev/mcai/companion/skills/end/EndIslandIngressGameTests*.class'
    exclude 'dev/mcai/companion/skills/building/BuildingGameTests*.class'
    exclude 'dev/mcai/companion/skills/foundation/FoundationGameTests*.class'
    exclude 'dev/mcai/companion/skills/foundation/ShelterMaterialExplorationGameTests*.class'
    exclude 'dev/mcai/companion/skills/foundation/WorkstationPrerequisiteGameTests*.class'
    exclude 'dev/mcai/companion/skills/redstone/RedstoneGameTests*.class'
    exclude 'dev/mcai/companion/mixin/gametest/**'
    exclude 'data/mcai_companion/test_instance/**'
    exclude 'data/mcai_companion/test_environment/**'
    exclude 'mcai_companion.gametest.mixins.json'
    manifest {
        attributes(
            'Specification-Title': 'Minecraft AI Companion',
            'Specification-Vendor': 'mcai',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'mcai',
            'MixinConfigs': 'mcai_companion.mixins.json,mcai_companion.client.mixins.json'
        )
    }
}

/*
 * Gradle does not remove artifacts from an older version when the project
 * version is bumped. That left multiple installable mcai_companion jars in
 * build/libs, which Forge correctly treated as duplicate mod IDs when a
 * user copied the whole directory. Old generated artifacts are moved to a
 * recoverable archive rather than deleted; the operation never touches
 * source files, run worlds, credentials, or the audit directory.
 */
def productLibDirectory = layout.buildDirectory.dir('libs').get().asFile
def archivedProductDirectory = layout.buildDirectory
    .dir('archive-libs').get().asFile
def currentProductFileName = "mcai_companion-${version}.jar"
tasks.register('archiveStaleProductJars') {
    doLast {
        if (!productLibDirectory.isDirectory()) {
            return
        }
        java.nio.file.Files.createDirectories(
            archivedProductDirectory.toPath()
        )
        java.nio.file.Files.list(productLibDirectory.toPath()).withCloseable {
            stream -> stream
                .filter { path ->
                    def name = path.fileName.toString()
                    name.startsWith('mcai_companion-') && name.endsWith('.jar')
                        && name != currentProductFileName
                }
                .forEach { path ->
                    def archivedName = "${path.fileName}.${System.currentTimeMillis()}.bak"
                    java.nio.file.Files.move(
                        path,
                        archivedProductDirectory.toPath()
                            .resolve(archivedName)
                    )
                }
        }
    }
}

tasks.named('jarJar') {
    dependsOn tasks.named('archiveStaleProductJars')
}

dependencies {
    // Compile against the oldest supported 26.2 Forge patch.  Runtime
    // metadata accepts later 65.x patches so players are not forced onto one
    // exact loader build.
    mcaiForgeApi minecraft.dependency(
        "net.minecraftforge:forge:26.2-${forgeCompileVersion}"
    )
    /*
     * Give each test Mod the Forge API without inheriting production runtime
     * libraries. In installed-product runs SQLite must come only from the
     * product JAR's Jar-in-Jar payload; inheriting main implementation here
     * would place a second org.xerial.sqlitejdbc module on the launch path.
     */
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'

    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    jarJar('org.xerial:sqlite-jdbc:3.50.3.0')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--add-modules', 'jdk.httpserver'
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('e2eClientJar')
    dependsOn tasks.named('e2eOracleJar')
}

tasks.register('e2eClientJar', Jar) {
    archiveBaseName = 'mcai-e2e-client'
    archiveVersion = project.version
    from sourceSets.e2eClient.output
    destinationDirectory = layout.buildDirectory.dir('e2e-libs')
}

tasks.register('e2eOracleJar', Jar) {
    archiveBaseName = 'mcai-e2e-oracle'
    archiveVersion = project.version
    from sourceSets.e2eOracle.output
    destinationDirectory = layout.buildDirectory.dir('e2e-libs')
}

def slimReleaseJar = tasks.named('jar').flatMap {
    it.archiveFile
}
def bundledReleaseJar = tasks.named('jarJar').flatMap {
    it.archiveFile
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    dependsOn tasks.named('jarJar')
    inputs.files(slimReleaseJar, bundledReleaseJar)

    doLast {
        def releaseJars = [
            slimReleaseJar.get().asFile,
            bundledReleaseJar.get().asFile
        ]
        def installableDirectory = bundledReleaseJar.get().asFile.parentFile
        def installableCandidates = java.nio.file.Files.list(
            installableDirectory.toPath()
        ).withCloseable { stream ->
            stream
                .filter { path ->
                    def name = path.fileName.toString()
                    name.startsWith('mcai_companion-')
                        && name.endsWith('.jar')
                        && !name.endsWith('-slim.jar')
                }
                .map { path -> path.toFile().canonicalFile }
                .toList()
        }
        if (installableCandidates.size() != 1
                || installableCandidates[0]
                    != bundledReleaseJar.get().asFile.canonicalFile) {
            throw new GradleException(
                'build/libs must contain exactly one current installable '
                    + 'mcai_companion JAR; found '
                    + installableCandidates.collect { it.name }
            )
        }
        releaseJars.each { releaseJar ->
            def archive = new java.util.jar.JarFile(releaseJar)
            try {
                def installable = !releaseJar.name.endsWith('-slim.jar')
                def hasModMetadata = archive.getJarEntry(
                    'META-INF/mods.toml'
                ) != null
                if (installable != hasModMetadata) {
                    throw new GradleException(
                        (installable ? 'Installable' : 'Slim')
                            + ' release JAR metadata mismatch: '
                            + releaseJar.name
                    )
                }
                def forbidden = []
                archive.entries().each { entry ->
                    def name = entry.name
                    def fileName = name.substring(
                        name.lastIndexOf('/') + 1
                    )
                    if (fileName ==~ /.*GameTests?(?:\$.*)?\.class/
                            || name.startsWith(
                                'data/mcai_companion/test_instance/'
                            )
                            || name.startsWith(
                                'data/mcai_companion/test_environment/'
                            )
                            || name.startsWith(
                                'dev/mcai/companion/mixin/gametest/'
                            )
                            || name.equals(
                                'mcai_companion.gametest.mixins.json'
                            )
                            || name.startsWith(
                                'dev/mcai/e2e/'
                            )) {
                        forbidden.add(name)
                    }
                }
                if (!forbidden.isEmpty()) {
                    throw new GradleException(
                        "Release JAR contains GameTest fixtures: "
                            + forbidden.sort().join(', ')
                    )
                }
                [
                    'mcai_companion.mixins.json',
                    'dev/mcai/companion/mixin/'
                        + 'AbstractBoatControlInvoker.class',
                    'dev/mcai/companion/skills/transport/'
                        + 'HeadlessBoatAuthority.class',
                    'dev/mcai/companion/mixin/'
                        + 'HeadlessBoatAuthorityMixin.class',
                    'dev/mcai/companion/mixin/'
                        + 'HeadlessBoatControlMixin.class',
                    'dev/mcai/companion/mixin/'
                        + 'HeadlessPlayerPhysicsMixin.class'
                ].each { requiredEntry ->
                    if (archive.getJarEntry(requiredEntry) == null) {
                        throw new GradleException(
                            "Release JAR is missing required headless "
                                + "physics entry: " + requiredEntry
                        )
                    }
                }
                def mixinConfigs = archive.manifest
                    ?.mainAttributes
                    ?.getValue('MixinConfigs')
                    ?.split(',')
                    ?.collect { it.trim() }
                if (mixinConfigs == null
                        || !mixinConfigs.contains(
                            'mcai_companion.mixins.json'
                        )) {
                    throw new GradleException(
                        "Release JAR manifest does not activate "
                            + "mcai_companion.mixins.json"
                    )
                }
            } finally {
                archive.close()
            }
        }
    }
}

/*
 * The compatibility declaration is an input to every release review.  This
 * task validates its schema/evidence separation but intentionally does not
 * promote the formal Forge patch matrix; that promotion requires the archived
 * real-client and model runs described by GOAL_STATE.json.
 */
tasks.register('compat-checker', Exec) {
    inputs.file(layout.projectDirectory.file('compat/forge-lines.toml'))
    inputs.file(layout.projectDirectory.file('scripts/validate-compat.py'))
    commandLine 'python3', 'scripts/validate-compat.py'
}

// Online major-line discovery is intentionally explicit rather than part of
// ordinary `check`: offline developer builds must remain reproducible, while
// release/compatibility workflows must fail as soon as Forge promotes a new
// major without an adapter module.
tasks.register('forge-major-discovery', Exec) {
    inputs.file(layout.projectDirectory.file('compat/forge-lines.toml'))
    inputs.file(layout.projectDirectory.file('scripts/discover-forge-lines.py'))
    commandLine(
        'python3',
        'scripts/discover-forge-lines.py',
        '--declaration',
        layout.projectDirectory.file('compat/forge-lines.toml').asFile.absolutePath,
        '--check-patches'
    )
    if (providers.gradleProperty('forge_promotions_file').isPresent()) {
        args '--promotions-file', providers.gradleProperty(
            'forge_promotions_file'
        ).get()
    }
}

tasks.named('check') {
    dependsOn tasks.named('compat-checker')
}

/*
 * Stable formal-gate entry points required by the project acceptance plan.
 * The Python runner records NOT_RUN/FAIL/PASS evidence and never turns a
 * missing Linux client, model, statistical batch, or mutation scenario into
 * a green result.  These tasks are intentionally not dependencies of build:
 * packaging must remain usable while the external release gates are pending.
 */
[
    'e2eFunctional',
    'e2eRendered',
    'e2eChat',
    'e2eMovement',
    'e2eInventory',
    'e2eRestart',
    'e2eXaero',
    'e2eM1',
    'e2eM2',
    'e2eM3',
    'e2eM4Shard',
    'aggregateHiddenSeeds',
    'soak24h',
    'soak100h',
    'recordHumanBaseline',
    'naturalnessReport',
    'mutationGate'
].each { gateName ->
    def formalForgeRuntime = providers.gradleProperty(
        'forge_runtime_version'
    ).getOrElse('65.1.0')
    tasks.register(gateName, Exec) {
        commandLine(
            'python3',
            'e2e/formal_gates.py',
            '--gate',
            gateName,
            '--forge-version',
            formalForgeRuntime
        )
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyReleaseJar')
}
